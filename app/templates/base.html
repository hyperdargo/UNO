<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}UNO: Normal, No Mercy &amp; Flip{% endblock %}</title>
  <meta name="description" content="{% block description %}Play UNO in your browser with friends or bots. Classic rules, No Mercy with stacking draws and knockouts, or Flip with its double-sided deck.{% endblock %}">
  <meta name="theme-color" content="#0f2a2e">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  {% block meta %}{% endblock %}
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <script src="{{ url_for('static', filename='js/font.js') }}" defer></script>
  {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include "partials/glyphs.html" %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/sw-register.js') }}" defer></script>
</body>
</html>
