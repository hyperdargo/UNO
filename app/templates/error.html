{% extends "base.html" %}
{% from "partials/card.html" import back %}
{% block title %}{{ title }} · UNO{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block body %}
<main id="main" class="auth">
  <div class="auth__panel auth__panel--center">
    <div class="auth__cards" aria-hidden="true">{{ back("s") }}</div>
    <p class="hint">Error {{ code }}</p>
    <h1 class="auth__title">{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn--primary" href="{{ url_for('main.index') }}">Go to the home page</a>
  </div>
</main>
{% endblock %}
